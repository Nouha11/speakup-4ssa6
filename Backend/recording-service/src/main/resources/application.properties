spring.application.name=recording-service
server.port=8085

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recording_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# Actuator (atelier Observabilite) : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Prometheus/Grafana : etiquette "application" sur chaque metrique
management.metrics.tags.application=${spring.application.name}
# Detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si sa base tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=recording-service
info.app.version=1.0.0
info.app.description=Microservice des enregistrements audio et des consentements
info.app.team=Vocalibre - 4SSA6
