# ── Identification ───────────────────────────────────────────────────────────
spring.application.name=certification-service
server.port=8085

# ── H2 (base embarquée – démo autonome, §7.5 Justification) ─────────────────
spring.datasource.url=jdbc:h2:mem:certdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console (http://localhost:8085/h2-console) ────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Actuator (/actuator/health) ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Swagger / OpenAPI (http://localhost:8085/swagger-ui.html) ─────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.tn.esprit.speakup=DEBUG
