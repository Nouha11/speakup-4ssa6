# ── Identification ───────────────────────────────────────────────────────────
spring.application.name=certification-service
server.port=8087

# ── H2 (base embarquée – démo autonome, §7.5 Justification) ─────────────────
spring.datasource.url=jdbc:h2:mem:certdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console (http://localhost:8087/h2-console) ────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ── Swagger / OpenAPI (http://localhost:8087/swagger-ui.html) ─────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.tn.esprit.speakup=DEBUG



# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator (atelier Observabilite) : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Prometheus/Grafana : etiquette "application" sur chaque metrique
management.metrics.tags.application=${spring.application.name}
# Detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si sa base tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=certification-service
info.app.version=1.0.0
info.app.description=Microservice des niveaux estimes et des attestations
info.app.team=Vocalibre - 4SSA6
