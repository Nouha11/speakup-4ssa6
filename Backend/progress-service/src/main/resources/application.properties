spring.application.name=progress-service
server.port=8086

# ── MySQL ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/progress_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Eureka (disabled until the Eureka server is ready in S5) ────────────────
eureka.client.enabled=false

# ── Swagger UI ──────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
