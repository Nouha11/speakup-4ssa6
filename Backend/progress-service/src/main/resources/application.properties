spring.application.name=progress-service
server.port=8086

# ── MySQL ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/progress_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Eureka registration ─────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ── Swagger UI ──────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html


# Actuator (atelier Observabilite) : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Prometheus/Grafana : etiquette "application" sur chaque metrique
management.metrics.tags.application=${spring.application.name}
# Detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si sa base tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=progress-service
info.app.version=1.0.0
info.app.description=Microservice de suivi de progression et des alertes formateur
info.app.team=Vocalibre - 4SSA6
