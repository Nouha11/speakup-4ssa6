spring.application.name=profile-service
server.port=8081

# ── H2 (mode fichier : groupes et preferences survivent au redemarrage) ─────
# Ajouter "data/" au .gitignore du service.
spring.datasource.url=jdbc:h2:file:./data/profile_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Console H2 (demonstration) : http://localhost:8081/h2-console ───────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Eureka (desactive tant que le serveur Eureka n'est pas pret, S5) ────────
eureka.client.enabled=false

# ── Swagger UI : http://localhost:8081/swagger-ui.html ──────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
