spring.application.name=profile-service
server.port=8081

# ── H2 (mode fichier : groupes et preferences survivent au redemarrage) ─────
# Ajouter "data/" au .gitignore du service.
spring.datasource.url=jdbc:h2:file:./data/profile_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Console H2 (demonstration) : http://localhost:8081/h2-console ───────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ── Swagger UI : http://localhost:8081/swagger-ui.html ──────────────────────
springdoc.swagger-ui.path=/swagger-ui.html


# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator (atelier Observabilite) : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Prometheus/Grafana : etiquette "application" sur chaque metrique
management.metrics.tags.application=${spring.application.name}
# Detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si sa base tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=profile-service
info.app.version=1.0.0
info.app.description=Microservice de gestion des profils et des groupes
info.app.team=Vocalibre - 4SSA6
