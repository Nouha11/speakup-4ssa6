spring.application.name=Gateway
server.port=8089


# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#  afficher l'instance choisie par la Gateway pour chaque requete
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# portail Swagger unifie -> http://localhost:8089/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Profil
springdoc.swagger-ui.urls[0].url=/profile-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Contenu
springdoc.swagger-ui.urls[1].url=/content-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Enregistrement
springdoc.swagger-ui.urls[2].url=/recording-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Examen
springdoc.swagger-ui.urls[3].url=/exam-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Certification
springdoc.swagger-ui.urls[4].url=/certification-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=Progression
springdoc.swagger-ui.urls[5].url=/progress-service/v3/api-docs
