spring.application.name=content-service
server.port=8082

# Config Server : "optional:" => le service demarre meme si le Config Server est arrete
spring.config.import=optional:configserver:http://localhost:8888

# Base H2 en memoire (rechargee au demarrage par data.sql a partir de l'etape 2)
spring.datasource.url=jdbc:h2:mem:contentdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Seed : data.sql est execute APRES la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Erreurs : message clair, sans trace Java
server.error.include-stacktrace=never
server.error.include-message=always


# Actuator (atelier Observabilite) : endpoints exposes (seul health l'est par defaut)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# Prometheus/Grafana : etiquette "application" sur chaque metrique
management.metrics.tags.application=${spring.application.name}
# Detail des composants dans /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always
# Transmettre a Eureka le statut de /health (le service passe DOWN si sa base tombe)
eureka.client.healthcheck.enabled=true
# Publier les proprietes info.* dans /actuator/info
management.info.env.enabled=true
info.app.name=content-service
info.app.version=1.0.0
info.app.description=Microservice du catalogue pedagogique (parcours, sujets, recommandations)
info.app.team=Vocalibre - 4SSA6
