spring.application.name=admin-server
server.port=8088

# Tableau de bord : http://localhost:8088
spring.boot.admin.ui.title=Vocalibre - Microservices

# Eureka : l'admin-server lit le registre pour trouver les microservices,
# mais ne s'y enregistre pas lui-meme (il n'apparait donc pas dans la liste)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# La Gateway n'expose pas Actuator : on ne la surveille pas
spring.boot.admin.discovery.ignored-services=Gateway
